<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Página não encontrada — Josué Mariano Gomes Junior</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1e29">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --paper: #131820;
      --ink: #f0f4f8;
      --muted: #aeb8c2;
      --accent: #2779A7;
      --accent-2: #49C5B6;
      --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --font-body: "Geist", ui-sans-serif, system-ui, sans-serif;
      --font-outlier: "Geist Mono", ui-monospace, monospace;
    }
    * { margin: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(60rem 60rem at 85% -10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
        radial-gradient(50rem 50rem at -10% 110%, color-mix(in oklab, var(--accent-2) 16%, transparent), transparent 60%),
        var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    .card { max-width: 34rem; text-align: center; }
    .mark {
      display: inline-block;
      margin-bottom: 2rem;
      font-family: var(--font-outlier);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      color: var(--accent-2);
      text-transform: uppercase;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.25rem, 6vw + 1rem, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent-2); }
    p {
      margin: 1.25rem auto 2.5rem;
      max-width: 26rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.4rem;
      border: 1px solid color-mix(in oklab, var(--accent-2) 55%, transparent);
      border-radius: 999px;
      background: color-mix(in oklab, var(--accent-2) 14%, transparent);
      color: var(--accent-2);
      font-weight: 600;
      text-decoration: none;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 180ms ease,
                  border-color 180ms ease;
    }
    .btn:hover { transform: translateY(-2px); border-color: var(--accent-2); }
    .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
    .back {
      display: block;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--accent-2); }
  </style>
</head>

<body>
  <main class="card">
    <p class="mark">jjunior.dev · erro 404</p>
    <h1>Este link caiu da <span>rede.</span></h1>
    <p>A página que você procura não existe ou foi movida. Em infraestrutura crítica, o plano B é sempre ter um caminho
      de volta — aqui é voltar para o início.</p>
    <a class="btn" href="./">Voltar ao início</a>
    <a class="back" href="mailto:juniorgm18@gmail.com">juniorgm18@gmail.com</a>
  </main>
</body>

</html>
